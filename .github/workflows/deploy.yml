name: Build and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Read GitHub Pages settings
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Check content and types
        run: npm run check
      - name: Test migration and legacy links
        run: npm test
      - name: Build the static site
        run: npm run build
        env:
          SITE_URL: ${{ format('https://{0}', steps.pages.outputs.host || 'www.pkowalski.com') }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
      - name: Check every page, local link and migrated file
        run: npm run verify
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
      - name: Scan Git history and generated website for secrets
        run: npm run check:secrets
      - name: Upload the website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
