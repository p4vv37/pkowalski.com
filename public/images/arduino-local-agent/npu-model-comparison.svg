<title id="title">Why Qwen2.5-3B?</title>
<desc id="desc">Full HA context, fixed-sentence benchmark, medians of 3 runs. Qwen3-1.7B: 18.148 seconds, requested response form 2 of 3. Qwen2.5-3B: 22.741 seconds, requested form 3 of 3. 4B QAIRT context was too short; 4B GGUF failed to load. No timing was measured for either.</desc>
