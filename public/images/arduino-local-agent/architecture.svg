<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="DejaVu Sans, sans-serif">
  <rect width="1240" height="760" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- ===== LVA microphone ===== -->
  <rect x="470" y="28" width="300" height="66" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="620" y="55" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Linux Voice Assistant</text>
  <text x="620" y="76" text-anchor="middle" font-size="12.5" fill="#475569">mikrofon · wybudzanie «Okay Nabu»</text>

  <!-- ===== Home Assistant ===== -->
  <rect x="270" y="170" width="700" height="72" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>
  <text x="620" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Home Assistant</text>
  <text x="620" y="220" text-anchor="middle" font-size="12.5" fill="#334155">orkiestracja etapów · wykonanie narzędzi (tool_calls)</text>

  <!-- ===== STT ===== -->
  <rect x="60" y="330" width="340" height="92" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="230" y="358" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1e3a8a">STT · mowa → tekst</text>
  <text x="230" y="380" text-anchor="middle" font-size="12.5" fill="#1e40af">Whisper Large-v3-Turbo W8A16</text>
  <text x="230" y="400" text-anchor="middle" font-size="12.5" fill="#1e40af">encoder + decoder na NPU</text>

  <!-- ===== Gateway / LLM ===== -->
  <rect x="450" y="300" width="340" height="212" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="620" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">bramka LLM · port 18191</text>

  <rect x="470" y="336" width="300" height="66" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="620" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">wąski router regułowy (CPU)</text>
  <text x="620" y="382" text-anchor="middle" font-size="12" fill="#92400e">jednoznaczne polecenia → tool_calls do HA</text>

  <rect x="470" y="420" width="300" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="446" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">Qwen2.5-3B-Instruct Q4_0</text>
  <text x="620" y="468" text-anchor="middle" font-size="12" fill="#1e40af">NPU (Hexagon, HTP0) · pozostałe żądania</text>

  <!-- ===== TTS ===== -->
  <rect x="840" y="330" width="340" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1010" y="358" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#14532d">TTS · tekst → mowa</text>
  <text x="1010" y="380" text-anchor="middle" font-size="12.5" fill="#15803d">Pocket TTS Polish</text>
  <text x="1010" y="400" text-anchor="middle" font-size="12.5" fill="#15803d">CPU · runtime Rust ARM64</text>

  <!-- ===== LVA speaker ===== -->
  <rect x="470" y="650" width="300" height="66" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="620" y="677" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Linux Voice Assistant</text>
  <text x="620" y="698" text-anchor="middle" font-size="12.5" fill="#475569">odtwarzanie odpowiedzi</text>

  <!-- ===== Arrows ===== -->
  <!-- mic -> HA -->
  <line x1="620" y1="94" x2="620" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- HA -> STT -->
  <line x1="440" y1="242" x2="235" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- HA -> gateway -->
  <line x1="620" y1="242" x2="620" y2="298" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- HA -> TTS -->
  <line x1="800" y1="242" x2="1005" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- STT -> speaker -->
  <line x1="235" y1="422" x2="530" y2="648" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- gateway(Qwen) -> speaker -->
  <line x1="620" y1="492" x2="620" y2="648" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- TTS -> speaker -->
  <line x1="1005" y1="422" x2="710" y2="648" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- router -> HA (tool_calls loop, dashed) -->
  <path d="M 470 360 C 360 360 330 300 330 244" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>
  <text x="300" y="310" text-anchor="middle" font-size="12" fill="#b45309">tool_calls</text>

  <!-- Legend -->
  <rect x="40" y="650" width="330" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="672" font-size="12.5" font-weight="bold" fill="#334155">Legenda</text>
  <rect x="56" y="684" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="78" y="696" font-size="12" fill="#334155">NPU (Hexagon)</text>
  <rect x="180" y="684" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="202" y="696" font-size="12" fill="#334155">CPU</text>
  <rect x="56" y="708" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="78" y="720" font-size="12" fill="#334155">logika regułowa</text>
</svg>
