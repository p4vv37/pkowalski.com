<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">One board. Three local models.</title>
<desc id="desc">Home Assistant exchanges audio with Linux Voice Assistant and calls STT, the LLM agent and TTS. LVA and all AI services run on VENTUNO Q. All results return to HA. Only HA executes device actions.</desc>
